name: Bug report
description: Report a reproducible defect or numerical discrepancy
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials and private datasets before posting.
  - type: input
    id: version
    attributes:
      label: MicroPerco version
      placeholder: 2.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Observed behavior
      description: Include expected behavior and a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python, operating system, NumPy, SciPy, and relevant optional dependencies.
    validations:
      required: true
  - type: textarea
    id: numerical
    attributes:
      label: Numerical context
      description: Units, domain/PBC semantics, threshold or conductance law (cutoff, decay length, electrode contacts), applied voltage, seed, and reference result if applicable.
